<?xml version="1.0" encoding="UTF-8" ?>
<svg
    width="128"
    height="128"
    viewBox="0 0 128 128"
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- Professional StreamDAB Analyzer Icon -->
    <!-- Background circle with gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#004578;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFFF00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FF6600;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <circle
        cx="64"
        cy="64"
        r="60"
        fill="url(#bgGradient)"
        stroke="#ffffff"
        stroke-width="2"
    />

    <!-- ETI Stream representation - geometric bars -->
    <g transform="translate(24, 45)">
        <!-- Frame structure bars -->
        <rect x="0" y="0" width="6" height="38" fill="#ffffff" opacity="0.9" />
        <rect x="10" y="8" width="6" height="30" fill="#ffffff" opacity="0.8" />
        <rect x="20" y="4" width="6" height="34" fill="#ffffff" opacity="0.9" />
        <rect
            x="30"
            y="12"
            width="6"
            height="26"
            fill="#ffffff"
            opacity="0.7"
        />
        <rect x="40" y="6" width="6" height="32" fill="#ffffff" opacity="0.8" />
        <rect
            x="50"
            y="10"
            width="6"
            height="28"
            fill="#ffffff"
            opacity="0.9"
        />
        <rect x="60" y="2" width="6" height="36" fill="#ffffff" opacity="1.0" />
        <rect
            x="70"
            y="14"
            width="6"
            height="24"
            fill="#ffffff"
            opacity="0.8"
        />
    </g>

    <!-- Digital waveform overlay -->
    <g transform="translate(16, 88)">
        <polyline
            points="0,0 12,-8 24,6 36,-4 48,8 60,-6 72,4 84,-8 96,0"
            stroke="url(#waveGradient)"
            stroke-width="3"
            fill="none"
            opacity="0.8"
        />
    </g>

    <!-- DAB symbol - stylized "D" -->
    <g transform="translate(45, 20)">
        <path
            d="M 0 0 L 0 20 L 12 20 C 18 20 22 16 22 10 C 22 4 18 0 12 0 Z M 4 4 L 12 4 C 16 4 18 6 18 10 C 18 14 16 16 12 16 L 4 16 Z"
            fill="#ffffff"
            opacity="0.9"
        />
    </g>

    <!-- Professional indicator dots -->
    <circle cx="20" cy="20" r="3" fill="#00FF00" opacity="0.8" />
    <circle cx="108" cy="20" r="3" fill="#FFFF00" opacity="0.8" />
    <circle cx="108" cy="108" r="3" fill="#FF6600" opacity="0.8" />

    <!-- Bottom text indicator -->
    <text
        x="64"
        y="115"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="bold"
        fill="#ffffff"
        opacity="0.9"
    >ETI</text>
</svg>
