# Release — tag-triggered GitHub Release with per-OS binaries.
#
# Triggered by tags vX.Y.Z (e.g. v1.6.0). Builds the same matrix as ci.yml,
# packages the produced binaries into per-OS archives and publishes a GitHub
# Release with auto-generated notes from the commit history since the previous
# tag.
#
# NOTE on packaging: `install()` rules + CPack (AppImage/.app/.dmg/NSIS) are
# still on the roadmap (INSTALL.md §6). Until then this job ships the raw
# build outputs (StreamDABAnalyser + streamdab-cli + the eti fixtures for
# validation); when CPack lands, switch these artifact steps to `cpack`
# outputs without touching the rest of the pipeline.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the Release + upload assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            configure: linux-gcc
            build: build-linux
            archive: linux-x86_64.tar.gz
          - name: windows
            os: windows-2022
            configure: windows-msvc
            build: build-windows
            archive: windows-x86_64.zip
          - name: macos
            os: macos-14
            configure: macos-brew
            build: build-macos
            archive: macos-arm64.tar.gz   # macos-14 runners are Apple Silicon

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------- dependencies
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev libfaad-dev libfftw3-dev libzmq3-dev build-essential

      - name: Install Qt 6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Bootstrap vcpkg deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-windows `
            faad2 fftw3 zeromq cppzmq gtest
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake qt@6 faad2 fftw libzmq googletest
          echo "QT_DIR=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      # ------------------------------------------------------- build + test
      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build (bounded)
        run: cmake --build --preset ${{ matrix.build }}

      - name: Test
        working-directory: build
        run: ctest --preset test-${{ matrix.name }}

      # ----------------------------------------------------------- package
      - name: Stage binaries (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: |
          mkdir -p stage
          cp StreamDABAnalyser streamdab-cli stage/
        # Windows exe names are copied in the Windows step below.

      - name: Stage binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item StreamDABAnalyser.exe stage/
          Copy-Item streamdab-cli.exe stage/

      - name: Archive
        if: runner.os != 'Windows'
        working-directory: build
        run: tar -czf ${{ matrix.archive }} -C stage .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath ${{ matrix.archive }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: build/${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (tags; for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download per-OS archives
        uses: actions/download-artifact@v4
        with:
          pattern: "*.tar.gz"
          path: assets
          merge-multiple: true

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          pattern: "*.zip"
          path: assets
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          # Commits since the previous tag (or all if none).
          PREV=$(git describe --tags --abbrev=0 --skip 1 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            git log -1 --format='%s%n%n%b' HEAD > RELEASE_NOTES.md
          else
            git log --format='- %s' "$PREV..HEAD" > RELEASE_NOTES.md
          fi
          {
            echo "Built and tested on Linux, Windows and macOS (ctest 55/55,"
            echo "fixture parity DLS+ 1114 / MOT 97/97)."
            echo ""
            echo "Assets: per-OS archives with the GUI (StreamDABAnalyser) and"
            echo "the CLI (streamdab-cli). Packaging via CPack/AppImage/.dmg"
            echo "lands in the next release."
          } >> RELEASE_NOTES.md

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "StreamDAB Analyser ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            assets/*