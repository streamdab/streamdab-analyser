# CI — Linux / Windows / macOS build + full test gate.
#
# Mirrors the local gates exactly: zero-error/zero-warning build, ctest 55/55,
# fixture parity, bounded parallelism (never a bare -j). Each OS uses its own
# CMake preset from CMakePresets.json; the offline-fixture tests run against
# the real eti/ fixtures checked into the repo.
#
# Runs on: push to main + feature branches, pull requests against main,
# manual dispatch. fetch-depth: 0 so the CMake DABX_VERSION resolution can see
# the git tags (version = last tag, e.g. 1.5.0).

name: CI

on:
  push:
    branches: [main, "feature/**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen   # BEFORE configure: registers all GUI test targets
  CTEST_TEST: "ctest --output-on-failure"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (ubuntu-24.04, system Qt 6)
            os: ubuntu-24.04
            configure: linux-gcc
            build: build-linux
            test: test-linux
            no-test-prefix: false
          - name: Windows (windows-2022, aqt Qt + vcpkg)
            os: windows-2022
            configure: windows-msvc
            build: build-windows
            test: test-windows
            shell: pwsh
          - name: macOS (macos-14, Homebrew Qt 6)
            os: macos-14
            configure: macos-brew
            build: build-macos
            test: test-macos
            no-test-prefix: true

    steps:
      - name: Checkout (with tags for the version resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------- Linux
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev libfaad-dev libfftw3-dev libzmq3-dev \
            qt6-base-private-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libasound2-dev libgtest-dev build-essential

      # -------------------------------------------------------------- Windows
      - name: Install Qt 6 (Windows, aqt; Multimedia included)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Bootstrap vcpkg and build the small native deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-windows `
            faad2 fftw3 zeromq cppzmq gtest
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg"

      # ---------------------------------------------------------------- macOS
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_UPGRADE=1 \
            brew install cmake qt@6 faad2 fftw zeromq cppzmq googletest
          echo "QT_DIR=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      # ------------------------------------------------------------ configure
      - name: Configure (-p ${{ matrix.configure }})
        run: >
          cmake --preset ${{ matrix.configure }}
          ${{ runner.os == 'Windows' && '-DDABX_ENABLE_ZMQ=ON' || '' }}
      # ZMQ is ON by default everywhere; the Windows preset reads $env{VCPKG_ROOT}
      # (set above). If a dependency is ever unavailable the ladder degrades and
      # the suite shrinks - the workflow then reports the actual count.

      # ----------------------------------------------------------------- build
      - name: Build (bounded, preset ${{ matrix.build }})
        if: runner.os != 'Windows'
        run: cmake --build --preset ${{ matrix.build }}

      # Windows: keep the full MSVC output so the warnings can be summarised.
      - name: Build (bounded, preset ${{ matrix.build }}) [Windows, log kept]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.build }} 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows build warning summary
        if: always() && runner.os == 'Windows'
        continue-on-error: true   # reporting only: never fail the job
        shell: pwsh
        run: python scripts/ci/windows_warning_summary.py build-windows.log

      # ----------------------------------------------------------------- tests
      # PUBLIC subset only: the eti/ captures are World DAB licensed and never
      # reach the public repo (docs/TEST_SUITE_PUBLIC_PRIVATE_SPLIT.md); the
      # full suite runs on machines that have the captures.
      # run from the repo root: ctest --preset needs CMakePresets.json here
      - name: Test (ctest ${{ matrix.test }} -L PUBLIC)
        run: ctest --preset ${{ matrix.test }} -L PUBLIC

      # QtTest output is lost when a Windows test crashes (stdout is not
      # flushed), so re-run each failed test directly with a verbose file log.
      # Also run every test function in its own process (order dependence) and,
      # when the Windows debugger is installed, print a stack trace of the crash.
      # (Only runs when a test failed.)
      - name: Diagnose failed tests (Windows, verbose rerun)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        working-directory: build
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          Write-Host "cdb available: $(Test-Path $cdb)"
          $list = 'Testing/Temporary/LastTestsFailed.log'
          if (Test-Path $list) {
            foreach ($line in Get-Content $list) {
              $name = ($line -split ':', 2)[1]
              if (-not $name) { continue }
              Write-Host "=== $name"
              $exe = Get-ChildItem -Path . -Recurse -Filter "$name.exe" | Select-Object -First 1
              if (-not $exe) { Write-Host 'executable not found'; continue }
              & $exe.FullName -v1 -o "$name.log,txt"
              Write-Host "whole-suite exit code: $LASTEXITCODE"
              # each test function alone
              $funcs = (& $exe.FullName -functions) | ForEach-Object { if ($_ -match '^(test\w+)\(\)') { $Matches[1] } }
              foreach ($f in $funcs) {
                & $exe.FullName $f -o "$name-$f.log,txt" | Out-Null
                Write-Host "alone: $f -> exit $LASTEXITCODE"
              }
              if (Test-Path $cdb) {
                Write-Host "--- stack of the crash (cdb)"
                & $cdb -G -g -c "g;kP 40;q" $exe.FullName 2>&1 | Select-Object -Last 90
              }
            }
          }
          exit 0

      # The package must run on its own: install it and start the installed
      # binaries with a PATH that has no Qt, vcpkg or Visual Studio in it.
      - name: Verify the installed Windows package runs (clean PATH)
        if: always() && runner.os == 'Windows' && hashFiles('build/Release/StreamDABAnalyser.exe') != ''
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix "$env:RUNNER_TEMP/stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/verify_windows_deploy.py "$env:RUNNER_TEMP/stage"

      # --------------------------------------------------------- smoke checks
      - name: CLI smoke (real fixture, Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: |
          ./streamdab-cli --version
          ./streamdab-cli --help | head -5
          # with the private captures present this also runs:
          #   ./streamdab-cli --input ../eti/bkk_20062022_141637.eti --output smoke.yaml

      # ------------------------------------------------------------- package
      # Build the same packages the release workflow ships, on every run, so
      # they can be downloaded from the run page and tried on a real machine
      # BEFORE a tag is pushed. Unsigned (no secrets here); the release
      # workflow adds signing when its secrets exist.
      - name: "Package (Linux: TGZ + DEB)"
        if: runner.os == 'Linux'
        working-directory: build
        run: |
          cpack --config CPackConfig.cmake -G TGZ
          cpack --config CPackConfig.cmake -G DEB
          ls -l *.tar.gz *.deb

      - name: "Package (Windows: ZIP)"
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          cpack --config CPackConfig.cmake -C Release -G ZIP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem *.zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # The shipped ZIP itself must run on a machine without Qt/vcpkg.
      - name: "Verify the Windows ZIP runs (clean PATH)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no ZIP produced by CPack" }
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/zipcheck"
          python scripts/ci/verify_windows_deploy.py "$env:RUNNER_TEMP/zipcheck"

      # NSIS installer: build it, check the icons, install it silently, run the
      # installed program with a clean PATH, then uninstall and check nothing is left.
      - name: "Package (Windows: NSIS installer)"
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
            $env:PATH += ';C:\Program Files (x86)\NSIS'
          }
          cpack --config CPackConfig.cmake -C Release -G NSIS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem streamdab-analyser*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: "Verify the Windows installer (icons, silent install, clean PATH, uninstall)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install pefile
          $setup = Get-ChildItem build -Filter 'streamdab-analyser*.exe' | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer produced by CPack" }
          python scripts/ci/check_pe_icon.py build/Release/StreamDABAnalyser.exe $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = Join-Path $env:RUNNER_TEMP 'nsis-install'
          Start-Process $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait
          if (-not (Test-Path "$dir\bin\StreamDABAnalyser.exe")) { throw "installer did not install the GUI into $dir" }
          python scripts/ci/check_pe_icon.py "$dir\bin\StreamDABAnalyser.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/verify_windows_deploy.py $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninst = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninst) { throw "no uninstaller in $dir" }
          # NSIS copies the uninstaller away first, otherwise -Wait returns at once.
          $tmp = Join-Path $env:RUNNER_TEMP 'uninst.exe'
          Copy-Item $uninst.FullName $tmp
          Start-Process $tmp -ArgumentList '/S', "_?=$dir" -Wait
          if (Test-Path "$dir\bin\StreamDABAnalyser.exe") { throw "uninstall left StreamDABAnalyser.exe behind" }
          Write-Host "installer install + uninstall OK"

      # Blocking: the bundle check used to fail silently (continue-on-error)
      # and hid a broken v1.0.0 macOS package.
      - name: "Package + verify (macOS: .app + .dmg)"
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle-macos.sh
          bash scripts/ci/verify_macos_bundle.sh dist/StreamDAB-Analyser.app
          ls -l build/*.dmg

      - name: "Upload packages (Linux)"
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ github.sha }}
          path: |
            build/*.tar.gz
            build/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: "Upload packages (Windows)"
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-${{ github.sha }}
          path: |
            build/*.zip
            build/streamdab-analyser*.exe
          if-no-files-found: error
          retention-days: 14

      - name: "Upload packages (macOS)"
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos-${{ github.sha }}
          path: build/*.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          # Visual Studio is multi-config: binaries land in build\Release
          .\Release\streamdab-cli.exe --version
          .\Release\streamdab-cli.exe --help | Select-Object -First 5
